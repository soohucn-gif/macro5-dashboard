name: 数据更新

on:
  schedule:
    # GitHub 的 schedule 触发经常迟到（2026-09 实测主枪天天迟约 2 小时、补枪迟约 4.5 小时），
    # 所以每天放两枪。
    # 抓取本身是幂等的（按日期合并），重复跑无副作用。
    # （注意：生成时间戳每次都变，所以两枪都会各提交一次，并不会「没新数据就跳过」。）
    # 主枪 22:12 UTC ≈ 北京 06:12。晚于 FRED H.15 当日发布(20:15 UTC)与美股收盘。
    - cron: "12 22 * * *"
    # 补枪 00:12 UTC ≈ 北京 08:12，接住主枪迟到或失败的情况。
    - cron: "12 0 * * *"
    # 每月 2 号 12:23 UTC，补一次上月月度快照（Damodaran 每月 1 号更新 ERP）。
    - cron: "23 12 2 * *"
  workflow_dispatch:
    inputs:
      full:
        description: "全量回补（首次或数据修复时用）"
        type: boolean
        default: false
      monthly:
        description: "同时生成上月月度快照"
        type: boolean
        default: false
      notify:
        description: "强制推送一条飞书（忽略当日已推标记）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 判定本次运行类型
        id: mode
        run: |
          FULL=""
          MONTHLY="no"
          if [ "${{ github.event.inputs.full }}" = "true" ]; then FULL="--full"; fi
          if [ "${{ github.event.schedule }}" = "23 12 2 * *" ]; then MONTHLY="yes"; fi
          if [ "${{ github.event.inputs.monthly }}" = "true" ]; then MONTHLY="yes"; fi
          echo "full=$FULL"       >> "$GITHUB_OUTPUT"
          echo "monthly=$MONTHLY" >> "$GITHUB_OUTPUT"

      # 单一数据源挂掉不能拖垮整轮：先尽力抓、尽力提交，最后一步再把失败暴露出来。
      - name: 抓取六类数据
        id: fetch
        continue-on-error: true
        run: python3 scripts/fetch_all.py ${{ steps.mode.outputs.full }}

      - name: 重建看板与当日快照
        id: build
        run: python3 scripts/build_dashboard.py

      # 每天一条飞书私聊（Henry）。always() 保证构建失败也会推"失败"而不是静默；
      # 脚本内部按 data/last_notify.txt 去重，补枪与月度快照运行不会重复推。
      # continue-on-error：推送失败（飞书接口抖动、token 过期）不能挡住下面的提交，
      # 否则当天抓到的数据整轮作废；失败留到最后一步再标红。
      - name: 推送飞书
        id: notify
        if: always()
        continue-on-error: true
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_OPEN_ID: ${{ secrets.FEISHU_OPEN_ID }}
          BUILD_FAILED: ${{ steps.build.outcome == 'failure' }}
        run: |
          FORCE=""
          if [ "${{ github.event.inputs.notify }}" = "true" ]; then FORCE="--force"; fi
          python3 scripts/notify_feishu.py $FORCE

      - name: 生成上月月度快照
        if: steps.mode.outputs.monthly == 'yes'
        run: python3 scripts/monthly_snapshot.py "$(date -u -d 'last month' +%Y-%m)"

      - name: 提交并推送
        run: |
          git config user.name  "macro5-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          STAMP=$(date -u +%Y-%m-%d)
          SUFFIX=""
          if [ "${{ steps.mode.outputs.monthly }}" = "yes" ]; then SUFFIX=" + 月度快照"; fi
          git commit -m "data: $STAMP 日更$SUFFIX"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

      - name: 汇报抓取结果
        env:
          NOTIFY_OUTCOME: ${{ steps.notify.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          rep = json.load(open("data/fetch_report.json", encoding="utf-8"))
          for j in rep["jobs"]:
              if j.get("ok"):
                  print("✅ %s  rows=%s  new=%s  last=%s"
                        % (j["label"], j["rows"], j["added"], j["last_date"]))
              else:
                  print("❌ %s  %s" % (j["label"], j.get("error")))
          bad = [j["label"] for j in rep["jobs"] if not j.get("ok")]
          if bad:
              print("::error::以下数据源抓取失败：" + "、".join(bad))
          if os.environ.get("NOTIFY_OUTCOME") == "failure":
              print("::error::飞书推送失败（数据已照常提交），详见「推送飞书」步骤日志")
          if bad or os.environ.get("NOTIFY_OUTCOME") == "failure":
              sys.exit(1)
          PY
